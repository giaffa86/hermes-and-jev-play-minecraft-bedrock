# Docker Compose per l'agente Hermes + Jev Bedrock sull'host Docker.
# Il container si connette al BDS via NetherNet e parla con il servizio
# Hermes esistente sulla rete Docker condivisa `hermes-internal`.
#
# Prima di avviare:
#   1. Creare .env nella stessa directory (vedi .env.example).
#   2. Verificare che esista la rete Docker `hermes-internal` di Hermes:
#        docker network ls | grep hermes-internal
#   3. Se il nome e' diverso, aggiornare networks.hermes-internal.name.

services:
  hermes-jev-bedrock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-jev-bedrock
    # Host networking: la sessione Bedrock/NetherNet (UDP 19132 +
    # WebRTC/ICE) non deve passare per il NAT del bridge Docker, che la
    # faceva cadere ogni 1-2 min. Con `network_mode: host` il servizio non
    # ha piu' `ports:`/`networks:` propri: l'API ascolta su API_HOST e il
    # firewall dell'host deve permetterla solo alla rete interna di Hermes
    # (es. `ufw allow from 172.29.0.0/24 to 172.29.0.1 port 3077 proto
    # tcp`, dove 172.29.0.1 e' il gateway di `hermes-internal`).
    network_mode: host
    env_file:
      - .env
    environment:
      # Interfaccia di ascolto dell'API del harness. Con host networking
      # 127.0.0.1 sarebbe la VM stessa; si usa il gateway di
      # `hermes-internal` perche' il controller gira nel container `hermes`.
      - API_HOST=172.29.0.1
      # URL del harness visto dal controller.
      # Controller sulla VM (fuori Docker): http://127.0.0.1:3077
      # Controller in un container della stessa rete:
      #   http://172.29.0.1:3077
      - HARNESS=http://172.29.0.1:3077
    volumes:
      # Log, eventi e mondi di test
      - ./runs:/app/runs
      # Persistenza cache token Xbox Live (per non rifare l'auth ogni
      # volta). Si puo' popolare copiando ~/.minecraft/nmp-cache dal nodo
      # nella directory ./nmp-cache accanto a questo file.
      - ./nmp-cache:/root/.minecraft/nmp-cache:rw
    restart: unless-stopped

networks:
  hermes-internal:
    external: true
    # Nome reale della rete Docker di Hermes (verificare sull'host Docker)
    name: hermes-internal
